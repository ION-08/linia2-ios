# Автопроверка «Линия 2.0» перед TestFlight (iPhone, iOS 18 или 17 в симуляторе):
#   1) юнит-тесты TinodeSDKTests;  2) XCUITest — 29 сценариев + запуск во всех конфигурациях.
# Нестабильные тесты перезапускаются до 2 раз (видно в отчёте). Упал хоть один — TestFlight не запускается.
# Отчёт — в Summary прогона; скриншоты всех экранов и падений, crash-отчёты — в артефакте test-results-N.
# Секреты: CI_TOKEN (служебный доступ к /invite/api/ci/*), L2_REVIEW_LOGIN / L2_REVIEW_PASSWORD (аккаунт проверки Apple).
name: UI tests

# Автоматически на каждый push в main (репозиторий публичный — минуты бесплатные).
# Загрузка в TestFlight — только вручную (testflight.yml), когда выполнены все задания и e2e прошёл 2 раза подряд.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    outputs:
      compiled:
        description: "Приложение собралось и тест запустился"
        value: ${{ jobs.uitest.outputs.compiled }}
      crashed:
        description: "Были вылеты приложения"
        value: ${{ jobs.uitest.outputs.crashed }}

concurrency:
  group: uitest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uitest:
    # Push с [release] тестирует release.yml (2 круга подряд) — отдельный прогон не нужен (общий тестовый сервер).
    if: ${{ github.workflow != 'UI tests' || github.event_name != 'push' || !contains(github.event.head_commit.message, '[release]') }}
    # macos-15: симуляторы iOS 18 уже установлены (на macos-26 их приходится скачивать ~30+ мин).
    # Сборка для TestFlight остаётся на macos-26 / Xcode 26 (testflight.yml).
    runs-on: macos-15
    timeout-minutes: 180
    outputs:
      compiled: ${{ steps.report.outputs.compiled }}
      crashed: ${{ steps.report.outputs.crashed }}
    # Одно устройство — iPhone 17 Pro (экономия минут). Для SE: device: se.
    strategy:
      matrix:
        include:
          - device: pro
            idx: 1
    env:
      API: https://v2.chat-linia.site/invite/api
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          # Последний Xcode 16.x (с ним в образе идут среды iOS 18); если нет — последний доступный.
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | grep -v beta | sort -V | tail -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"; xcodebuild -version
          xcrun simctl list runtimes available | grep -i ios || true

      - name: Подготовка
        run: |
          cp ci/GoogleService-Info.stub.plist GoogleService-Info.plist
          which pod || sudo gem install cocoapods --no-document
          pod install --repo-update

      - name: Тестовые данные на сервере
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          [ -n "$CI_TOKEN" ] || { echo "::error::нет секрета CI_TOKEN"; exit 1; }
          RUN="${{ github.run_id }}${{ github.run_attempt }}"; RUN="${RUN: -9}${{ matrix.idx }}"
          curl -sf -X POST "$API/ci/setup" -H "Authorization: Bearer $CI_TOKEN" -H 'Content-Type: application/json' \
               -d "{\"run\":\"$RUN\"}" -o "$RUNNER_TEMP/ci.json"
          python3 - "$RUNNER_TEMP/ci.json" >> "$GITHUB_ENV" <<'PY'
          import json, secrets, sys
          d = json.load(open(sys.argv[1]))
          regpw = "Ci-" + secrets.token_urlsafe(10)
          for k, v in [("L2_CODE", d["code"]), ("L2_LOGIN", d["login"]), ("L2_PASSWORD", d["password"]),
                       ("L2_REG_LOGIN", d["reg_login"]), ("L2_REG_PASSWORD", regpw)]:
              print(f"{k}={v}")
          PY
          # Второй тестовый пользователь — собеседник с готовой историей переписки.
          PEER="${RUN:0:9}7"
          curl -sf -X POST "$API/ci/setup" -H "Authorization: Bearer $CI_TOKEN" -H 'Content-Type: application/json' \
               -d "{\"run\":\"$PEER\"}" -o "$RUNNER_TEMP/peer.json"
          python3 - "$RUNNER_TEMP/peer.json" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print(f"L2_PEER_LOGIN={d['login']}"); print(f"L2_PEER_PASSWORD={d['password']}")
          PY
          echo "::add-mask::$(grep '^L2_PEER_PASSWORD=' $GITHUB_ENV | tail -1 | cut -d= -f2-)"
          echo "::add-mask::$(grep '^L2_PASSWORD=' $GITHUB_ENV | tail -1 | cut -d= -f2-)"
          echo "::add-mask::$(grep '^L2_REG_PASSWORD=' $GITHUB_ENV | tail -1 | cut -d= -f2-)"

      - name: История переписки для теста
        run: |
          cat > "$RUNNER_TEMP/seed.mjs" <<'EOF'
          const API = 'wss://v2.chat-linia.site/v0/channels?apikey=AQEAAAABAAD_rAp4DJh05a1HAwFT3A6K';
          function client(login, pass) {
            const ws = new WebSocket(API); let id = 0; const pend = {}; const opened = new Promise(r => ws.onopen = r);
            const c = { req: o => new Promise((res, rej) => { const k = String(++id); const key = Object.keys(o)[0]; o[key].id = k; pend[k] = res; ws.send(JSON.stringify(o)); setTimeout(() => rej(new Error('timeout ' + key)), 15000); }) };
            ws.onmessage = ev => { const m = JSON.parse(ev.data); if (m.ctrl && pend[m.ctrl.id]) { pend[m.ctrl.id](m.ctrl); delete pend[m.ctrl.id]; } };
            c.login = async () => { await opened; await c.req({ hi: { ver: '0.25' } });
              const l = await c.req({ login: { scheme: 'basic', secret: Buffer.from(login + ':' + pass).toString('base64') } }); c.uid = l.params?.user; return l.code; };
            return c;
          }
          const A = client(process.env.L2_LOGIN, process.env.L2_PASSWORD), B = client(process.env.L2_PEER_LOGIN, process.env.L2_PEER_PASSWORD);
          console.log('вход', await A.login(), await B.login());
          await B.req({ set: { topic: 'me', desc: { public: { fn: 'Собеседник CI' } } } }).catch(() => {});
          const sb = await B.req({ sub: { topic: A.uid } }); const topic = sb.topic || A.uid;
          for (let i = 1; i <= 3; i++) { const p = await B.req({ pub: { topic, content: 'История ' + i } }); console.log('pub', p.code); }
          const sa = await A.req({ sub: { topic: B.uid } }); await A.req({ pub: { topic: sa.topic || B.uid, content: 'История ответ' } });
          process.exit(0);
          EOF
          node "$RUNNER_TEMP/seed.mjs" || echo "::warning::не удалось подготовить историю"

      - name: Симулятор (iPhone, iOS 18 или 17)
        run: |
          pick() { xcrun simctl list runtimes available | grep -o "com.apple.CoreSimulator.SimRuntime.iOS-$1-[0-9-]*" | sort -V | tail -1; }
          RT=$(pick 18); [ -n "$RT" ] || RT=$(pick 17)
          if [ -z "$RT" ]; then
            echo "Среды iOS 18/17 нет на раннере — скачиваю iOS 18"
            xcodebuild -downloadPlatform iOS -buildVersion 18.6 >/dev/null 2>&1 || xcodebuild -downloadPlatform iOS -buildVersion 18.5 >/dev/null 2>&1 || true
            RT=$(pick 18); [ -n "$RT" ] || RT=$(pick 17)
          fi
          [ -n "$RT" ] || { echo "::error::Нет симулятора iOS 18/17 — тесты не запущены, загрузки в TestFlight не будет"; xcrun simctl list runtimes; exit 1; }
          UDID=""
          for DT in iPhone-16-Pro iPhone-16 iPhone-15-Pro iPhone-15; do
            UDID=$(xcrun simctl create "L2 $DT" "com.apple.CoreSimulator.SimDeviceType.$DT" "$RT" 2>/dev/null) && break || UDID=""
          done
          [ -n "$UDID" ] || { echo "::error::не удалось создать iPhone на $RT"; exit 1; }
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "Симулятор: $(xcrun simctl list devices | grep "$UDID" | sed 's/^ *//') на ${RT##*.}" | tee -a "$GITHUB_STEP_SUMMARY"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1 || true
          # Без обучающих подсказок клавиатуры и автоисправлений — они перекрывают поля в тесте.
          for k in DidShowContinuousPathIntroduction DidShowGestureKeyboardIntroduction; do
            xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences $k -bool true || true
          done
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences KeyboardAutocorrection -bool false || true
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences KeyboardPrediction -bool false || true

      - name: Юнит-тесты
        id: unit
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Tinodios.xcworkspace -scheme Tinodios -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:TinodeSDKTests \
            -retry-tests-on-failure -test-iterations 3 \
            -resultBundlePath "$RUNNER_TEMP/unit.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee "$RUNNER_TEMP/unit.log" | grep -E 'error:|Test Case .* (passed|failed)|\*\* TEST' || true
          grep -q '\*\* TEST SUCCEEDED \*\*' "$RUNNER_TEMP/unit.log"

      - name: Выпуск требует теста звонка iOS ↔ веб
        if: ${{ github.workflow == 'Release' && hashFiles('ci/web-tests/call-peer.mjs') == '' }}
        run: echo "::error::нет ci/web-tests/call-peer.mjs — звонок iOS ↔ веб не проверить, выпуск невозможен"; exit 1

      - name: Веб-собеседник для звонка iOS ↔ веб (Playwright)
        if: ${{ !cancelled() && hashFiles('ci/web-tests/call-peer.mjs') != '' }}
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/web" "$RUNNER_TEMP/out/web"
          cd "$RUNNER_TEMP/web" && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          cp "$GITHUB_WORKSPACE"/ci/web-tests/*.mjs "$RUNNER_TEMP/web/"
          # Ждёт входящий звонок от iOS (тест test00_CallToWebPeer идёт первым), принимает, проверяет ICE и медиатрафик.
          ( cd "$RUNNER_TEMP/web" && L2_PEER_LOGIN="$L2_PEER_LOGIN" L2_PEER_PASSWORD="$L2_PEER_PASSWORD" L2_PEER_WAIT_SEC=1500 \
            OUT_DIR="$RUNNER_TEMP/out/web" node call-peer.mjs > "$RUNNER_TEMP/out/web/call-peer.json" 2> "$RUNNER_TEMP/out/web/call-peer.log"; \
            echo $? > "$RUNNER_TEMP/out/web/call-peer.rc" ) &
          echo "L2_WEB_PEER=1" >> "$GITHUB_ENV"
          sleep 20

      - name: XCUITest
        id: test
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          export TEST_RUNNER_L2_PEER_NAME="Собеседник CI" TEST_RUNNER_L2_PEER_LOGIN="$L2_PEER_LOGIN"
          export TEST_RUNNER_L2_WEB_PEER="${L2_WEB_PEER:-0}"
          export TEST_RUNNER_L2_CODE="$L2_CODE" TEST_RUNNER_L2_LOGIN="$L2_LOGIN" TEST_RUNNER_L2_PASSWORD="$L2_PASSWORD" \
                 TEST_RUNNER_L2_REG_LOGIN="$L2_REG_LOGIN" TEST_RUNNER_L2_REG_PASSWORD="$L2_REG_PASSWORD" \
                 TEST_RUNNER_L2_REVIEW_LOGIN="${{ secrets.L2_REVIEW_LOGIN }}" TEST_RUNNER_L2_REVIEW_PASSWORD="${{ secrets.L2_REVIEW_PASSWORD }}"
          # Нестабильные тесты перезапускаются до 2 раз; каждый перезапуск виден в отчёте.
          xcodebuild test \
            -workspace Tinodios.xcworkspace -scheme Tinodios -configuration Release \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:TinodiosUITests \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 3 \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            ENABLE_TESTABILITY=YES \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee "$RUNNER_TEMP/test.log" | grep -E 'error:|Test Case .* (passed|failed|skipped)|crash|\*\* TEST' || true
          grep -q '\*\* TEST SUCCEEDED \*\*' "$RUNNER_TEMP/test.log"

      - name: Итог звонка iOS ↔ веб
        id: webpeer
        if: ${{ !cancelled() && env.L2_WEB_PEER == '1' }}
        run: |
          for i in $(seq 1 60); do [ -f "$RUNNER_TEMP/out/web/call-peer.rc" ] && break; sleep 5; done
          RC=$(cat "$RUNNER_TEMP/out/web/call-peer.rc" 2>/dev/null || echo 99)
          echo "### Звонок iOS → веб: веб-сторона $( [ "$RC" = 0 ] && echo '✅ прошёл' || echo "❌ упал (код $RC)")" >> "$GITHUB_STEP_SUMMARY"
          tail -c 3000 "$RUNNER_TEMP/out/web/call-peer.json" 2>/dev/null | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
          [ "$RC" = 0 ]

      - name: Отчёт, скриншоты падений
        id: report
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out/shots" "$RUNNER_TEMP/out/failures" "$RUNNER_TEMP/out/crashes"
          for r in unit ui; do
            X="$RUNNER_TEMP/$r.xcresult"; [ -d "$X" ] || continue
            xcrun xcresulttool get test-results tests --path "$X" > "$RUNNER_TEMP/out/$r-tests.json" 2>/dev/null || true
            xcrun xcresulttool export attachments --path "$X" --output-path "$RUNNER_TEMP/out/failures/$r" --only-failures >/dev/null 2>&1 || true
          done
          [ -d "$RUNNER_TEMP/ui.xcresult" ] && xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" --output-path "$RUNNER_TEMP/out/shots" >/dev/null 2>&1 || true
          find ~/Library/Logs/DiagnosticReports -name '*.ips' -newer "$RUNNER_TEMP/ci.json" -exec cp {} "$RUNNER_TEMP/out/crashes/" \; 2>/dev/null || true
          cp "$RUNNER_TEMP"/unit.log "$RUNNER_TEMP"/test.log "$RUNNER_TEMP/out/" 2>/dev/null || true
          python3 ci/test-report.py "$RUNNER_TEMP/out" | tee "$RUNNER_TEMP/out/report.md" >> "$GITHUB_STEP_SUMMARY"
          if grep -qE '\*\* TEST (SUCCEEDED|FAILED) \*\*' "$RUNNER_TEMP/test.log" 2>/dev/null; then C=true; else C=false; fi
          if ls "$RUNNER_TEMP/out/crashes"/*.ips >/dev/null 2>&1 || grep -qE 'Restarting after unexpected exit|Lost connection to the test runner|terminated due to signal|crashed in ' "$RUNNER_TEMP/test.log" 2>/dev/null; then K=true; else K=false; fi
          echo "compiled=$C" >> "$GITHUB_OUTPUT"; echo "crashed=$K" >> "$GITHUB_OUTPUT"
          echo "Вылеты приложения: $K" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore

      - name: Удалить тестовых пользователей
        if: always()
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/del.mjs" <<'EOF'
          const [login, pass] = process.argv.slice(2);
          const ws = new WebSocket('wss://v2.chat-linia.site/v0/channels?apikey=AQEAAAABAAD_rAp4DJh05a1HAwFT3A6K');
          const send = o => ws.send(JSON.stringify(o));
          ws.onopen = () => send({hi:{id:'1',ver:'0.25'}});
          ws.onmessage = ev => { const m = JSON.parse(ev.data);
            if (m.meta && m.meta.sub) for (const s of m.meta.sub) if (s.topic && s.topic !== 'me') send({del:{id:'t'+s.topic,topic:s.topic,what:'topic',hard:true}});
            if (!m.ctrl) return;
            if (m.ctrl.id==='1') send({login:{id:'2',scheme:'basic',secret:Buffer.from(login+':'+pass).toString('base64')}});
            else if (m.ctrl.id==='2') { if (m.ctrl.code>=300) { console.log(login, 'вход', m.ctrl.code); process.exit(0); } send({sub:{id:'4',topic:'me',get:{what:'sub'}}}); }
            else if (m.ctrl.id==='4') { setTimeout(() => send({del:{id:'3',what:'user',hard:true}}), 1500); }
            else if (m.ctrl.id==='3') { console.log(login, 'удалён', m.ctrl.code); process.exit(0); } };
          setTimeout(()=>{ console.log(login, 'таймаут'); process.exit(0); }, 15000);
          EOF
          [ -n "$L2_LOGIN" ] && node "$RUNNER_TEMP/del.mjs" "$L2_LOGIN" "$L2_PASSWORD" || true
          [ -n "$L2_REG_LOGIN" ] && node "$RUNNER_TEMP/del.mjs" "$L2_REG_LOGIN" "$L2_REG_PASSWORD" || true
          [ -n "$L2_PEER_LOGIN" ] && node "$RUNNER_TEMP/del.mjs" "$L2_PEER_LOGIN" "$L2_PEER_PASSWORD" || true
