# Автопроверка «Линия 2.0» перед TestFlight (iPhone, iOS 18 или 17 в симуляторе):
#   1) юнит-тесты TinodeSDKTests;  2) XCUITest — 29 сценариев + запуск во всех конфигурациях.
# Нестабильные тесты перезапускаются до 2 раз (видно в отчёте). Упал хоть один — TestFlight не запускается.
# Отчёт — в Summary прогона; скриншоты всех экранов и падений, crash-отчёты — в артефакте test-results-N.
# Секреты: CI_TOKEN (служебный доступ к /invite/api/ci/*), L2_REVIEW_LOGIN / L2_REVIEW_PASSWORD (аккаунт проверки Apple).
name: UI tests

# Автоматически на каждый push в main (репозиторий публичный — минуты бесплатные).
# Загрузка в TestFlight — только вручную (testflight.yml), когда выполнены все задания и e2e прошёл 2 раза подряд.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      design:
        description: "Дизайн-контроль: только снимки экранов (Linia2DesignShots) на SE / 16 / 16 Pro Max × тема × шрифт"
        type: boolean
        default: false
  workflow_call:
    outputs:
      compiled:
        description: "Приложение собралось и тест запустился"
        value: ${{ jobs.uitest.outputs.compiled }}
      crashed:
        description: "Были вылеты приложения"
        value: ${{ jobs.uitest.outputs.crashed }}

concurrency:
  group: uitest-${{ github.workflow }}-${{ github.ref }}-${{ inputs.design || 'main' }}
  cancel-in-progress: true

jobs:
  uitest:
    # Push с [release] тестирует release.yml (2 круга подряд) — отдельный прогон не нужен (общий тестовый сервер).
    # Ручной запуск с design=true — только job design.
    if: ${{ (github.workflow != 'UI tests' || github.event_name != 'push' || !contains(github.event.head_commit.message, '[release]')) && !(github.event_name == 'workflow_dispatch' && inputs.design) }}
    # macos-15: симуляторы iOS 18 уже установлены (на macos-26 их приходится скачивать ~30+ мин).
    # Сборка для TestFlight остаётся на macos-26 / Xcode 26 (testflight.yml).
    runs-on: macos-15
    timeout-minutes: 180
    outputs:
      compiled: ${{ steps.report.outputs.compiled }}
      crashed: ${{ steps.report.outputs.crashed }}
    # Одно устройство — iPhone 17 Pro (экономия минут). Для SE: device: se.
    strategy:
      matrix:
        include:
          - device: pro
            idx: 1
    env:
      API: https://v2.chat-linia.site/invite/api
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          # Последний Xcode 16.x (с ним в образе идут среды iOS 18); если нет — последний доступный.
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | grep -v beta | sort -V | tail -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"; xcodebuild -version
          xcrun simctl list runtimes available | grep -i ios || true

      - name: Подготовка
        run: |
          cp ci/GoogleService-Info.stub.plist GoogleService-Info.plist
          which pod || sudo gem install cocoapods --no-document
          pod install --repo-update

      - name: Тестовые данные на сервере
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          [ -n "$CI_TOKEN" ] || { echo "::error::нет секрета CI_TOKEN"; exit 1; }
          RUN="${{ github.run_id }}${{ github.run_attempt }}"; RUN="${RUN: -9}${{ matrix.idx }}"
          curl -sf -X POST "$API/ci/setup" -H "Authorization: Bearer $CI_TOKEN" -H 'Content-Type: application/json' \
               -d "{\"run\":\"$RUN\"}" -o "$RUNNER_TEMP/ci.json"
          python3 - "$RUNNER_TEMP/ci.json" >> "$GITHUB_ENV" <<'PY'
          import json, secrets, sys
          d = json.load(open(sys.argv[1]))
          regpw = "Ci-" + secrets.token_urlsafe(10)
          for k, v in [("L2_CODE", d["code"]), ("L2_LOGIN", d["login"]), ("L2_PASSWORD", d["password"]),
                       ("L2_REG_LOGIN", d["reg_login"]), ("L2_REG_PASSWORD", regpw)]:
              print(f"{k}={v}")
          PY
          # Второй тестовый пользователь — собеседник с готовой историей переписки.
          PEER="${RUN:0:9}7"
          curl -sf -X POST "$API/ci/setup" -H "Authorization: Bearer $CI_TOKEN" -H 'Content-Type: application/json' \
               -d "{\"run\":\"$PEER\"}" -o "$RUNNER_TEMP/peer.json"
          python3 - "$RUNNER_TEMP/peer.json" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print(f"L2_PEER_LOGIN={d['login']}"); print(f"L2_PEER_PASSWORD={d['password']}")
          PY
          # Третий тестовый пользователь C — принимает звонок на втором симуляторе (iOS ↔ iOS).
          CUSR="${RUN:0:9}8"
          curl -sf -X POST "$API/ci/setup" -H "Authorization: Bearer $CI_TOKEN" -H 'Content-Type: application/json' \
               -d "{\"run\":\"$CUSR\"}" -o "$RUNNER_TEMP/c.json"
          python3 - "$RUNNER_TEMP/c.json" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print(f"L2_C_LOGIN={d['login']}"); print(f"L2_C_PASSWORD={d['password']}")
          PY
          echo "::add-mask::$(grep '^L2_C_PASSWORD=' $GITHUB_ENV | tail -1 | cut -d= -f2-)"
          echo "::add-mask::$(grep '^L2_PEER_PASSWORD=' $GITHUB_ENV | tail -1 | cut -d= -f2-)"
          echo "::add-mask::$(grep '^L2_PASSWORD=' $GITHUB_ENV | tail -1 | cut -d= -f2-)"
          echo "::add-mask::$(grep '^L2_REG_PASSWORD=' $GITHUB_ENV | tail -1 | cut -d= -f2-)"

      - name: История переписки для теста
        run: node ci/seed-chat.mjs || echo "::warning::не удалось подготовить историю"

      - name: Симулятор (iPhone, iOS 18 или 17)
        run: |
          pick() { xcrun simctl list runtimes available | grep -o "com.apple.CoreSimulator.SimRuntime.iOS-$1-[0-9-]*" | sort -V | tail -1; }
          RT=$(pick 18); [ -n "$RT" ] || RT=$(pick 17)
          if [ -z "$RT" ]; then
            echo "Среды iOS 18/17 нет на раннере — скачиваю iOS 18"
            xcodebuild -downloadPlatform iOS -buildVersion 18.6 >/dev/null 2>&1 || xcodebuild -downloadPlatform iOS -buildVersion 18.5 >/dev/null 2>&1 || true
            RT=$(pick 18); [ -n "$RT" ] || RT=$(pick 17)
          fi
          [ -n "$RT" ] || { echo "::error::Нет симулятора iOS 18/17 — тесты не запущены, загрузки в TestFlight не будет"; xcrun simctl list runtimes; exit 1; }
          UDID=""
          for DT in iPhone-16-Pro iPhone-16 iPhone-15-Pro iPhone-15; do
            UDID=$(xcrun simctl create "L2 $DT" "com.apple.CoreSimulator.SimDeviceType.$DT" "$RT" 2>/dev/null) && break || UDID=""
          done
          [ -n "$UDID" ] || { echo "::error::не удалось создать iPhone на $RT"; exit 1; }
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "Симулятор: $(xcrun simctl list devices | grep "$UDID" | sed 's/^ *//') на ${RT##*.}" | tee -a "$GITHUB_STEP_SUMMARY"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1 || true
          # Без обучающих подсказок клавиатуры и автоисправлений — они перекрывают поля в тесте.
          for k in DidShowContinuousPathIntroduction DidShowGestureKeyboardIntroduction; do
            xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences $k -bool true || true
          done
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences KeyboardAutocorrection -bool false || true
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences KeyboardPrediction -bool false || true

      - name: Юнит-тесты
        id: unit
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Tinodios.xcworkspace -scheme Tinodios -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:TinodeSDKTests \
            -retry-tests-on-failure -test-iterations 3 \
            -resultBundlePath "$RUNNER_TEMP/unit.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee "$RUNNER_TEMP/unit.log" | grep -E 'error:|Test Case .* (passed|failed)|\*\* TEST' || true
          grep -q '\*\* TEST SUCCEEDED \*\*' "$RUNNER_TEMP/unit.log"

      - name: Выпуск требует теста звонка iOS ↔ веб
        if: ${{ github.workflow == 'Release' && hashFiles('ci/web-tests/call-peer.mjs') == '' }}
        run: echo "::error::нет ci/web-tests/call-peer.mjs — звонок iOS ↔ веб не проверить, выпуск невозможен"; exit 1

      - name: Веб-собеседник для звонка iOS ↔ веб (Playwright)
        if: ${{ !cancelled() && hashFiles('ci/web-tests/call-peer.mjs') != '' }}
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/web" "$RUNNER_TEMP/out/web"
          cd "$RUNNER_TEMP/web" && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          cp "$GITHUB_WORKSPACE"/ci/web-tests/*.mjs "$RUNNER_TEMP/web/"
          # Ждёт входящий звонок от iOS (тест test00_CallToWebPeer идёт первым), принимает, проверяет ICE и медиатрафик.
          ( cd "$RUNNER_TEMP/web" && L2_PEER_LOGIN="$L2_PEER_LOGIN" L2_PEER_PASSWORD="$L2_PEER_PASSWORD" WAIT_S=1500 PEER_WAIT_HANGUP=1 HANGUP_WAIT_S=180 \
            OUT_DIR="$RUNNER_TEMP/out/web" node call-peer.mjs > "$RUNNER_TEMP/out/web/call-peer.json" 2> "$RUNNER_TEMP/out/web/call-peer.log"; \
            echo $? > "$RUNNER_TEMP/out/web/call-peer.rc" ) &
          echo "L2_WEB_PEER=1" >> "$GITHUB_ENV"
          sleep 20

      - name: XCUITest
        id: test
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          export TEST_RUNNER_L2_PEER_NAME="Собеседник CI" TEST_RUNNER_L2_PEER_LOGIN="$L2_PEER_LOGIN"
          export TEST_RUNNER_L2_WEB_PEER="${L2_WEB_PEER:-0}"
          # Собеседник B управляется из теста (TinodiosUITestsFeatures: прочтение, кружок обратно).
          export TEST_RUNNER_L2_PEER_PASSWORD="$L2_PEER_PASSWORD" TEST_RUNNER_L2_IOS_UID="${L2_IOS_UID:-}"
          export TEST_RUNNER_L2_CODE="$L2_CODE" TEST_RUNNER_L2_LOGIN="$L2_LOGIN" TEST_RUNNER_L2_PASSWORD="$L2_PASSWORD" \
                 TEST_RUNNER_L2_REG_LOGIN="$L2_REG_LOGIN" TEST_RUNNER_L2_REG_PASSWORD="$L2_REG_PASSWORD" \
                 TEST_RUNNER_L2_REVIEW_LOGIN="${{ secrets.L2_REVIEW_LOGIN }}" TEST_RUNNER_L2_REVIEW_PASSWORD="${{ secrets.L2_REVIEW_PASSWORD }}"
          # Нестабильные тесты перезапускаются до 2 раз; каждый перезапуск виден в отчёте.
          xcodebuild test \
            -workspace Tinodios.xcworkspace -scheme Tinodios -configuration Release \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:TinodiosUITests \
            -skip-testing:TinodiosUITests/Linia2CallTests -skip-testing:TinodiosUITests/Linia2CallPeerTests \
            -skip-testing:TinodiosUITests/Linia2DesignShots -skip-testing:TinodiosUITests/Linia2LaunchTests \
            -skip-testing:TinodiosUITests/Linia2PanicTests \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 3 \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            ENABLE_TESTABILITY=YES \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee "$RUNNER_TEMP/test.log" | grep -E 'error:|Test Case .* (passed|failed|skipped)|crash|\*\* TEST' || true
          grep -q '\*\* TEST SUCCEEDED \*\*' "$RUNNER_TEMP/test.log"

      # Запуск при новых сообщениях (вылет сборки 1005): холодный старт, нажатие на уведомление, фон короткий/длинный.
      # Тест кладёт payload в $L2_PUSH_DIR/<имя>.apns, фоновый цикл ниже делает `simctl push` и отвечает <имя>.apns.sent.
      - name: Запуск приложения из уведомления (Linia2LaunchTests)
        id: launch
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          # После XCUITest (повторы) симулятор бывает выключен — включаем и ждём загрузки.
          # Свой .xctestrun в отдельной папке сборки (не тот, что оставил `xcodebuild test` основного шага —
          # с ним были «No matching device … in XCTestDevices» и «server died»). Собирается один раз на оба шага.
          for D in "$UDID" ${UDID2:-}; do xcrun simctl boot "$D" 2>/dev/null || true; xcrun simctl bootstatus "$D" -b >/dev/null 2>&1 || true; done
          DD="$RUNNER_TEMP/dd-steps"
          XR=$(find "$DD" -name '*.xctestrun' -print 2>/dev/null | head -1)
          if [ -z "$XR" ]; then
            xcodebuild build-for-testing -workspace Tinodios.xcworkspace -scheme Tinodios -configuration Release \
              -derivedDataPath "$DD" -destination "platform=iOS Simulator,id=$UDID" ENABLE_TESTABILITY=YES \
              CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
              > "$RUNNER_TEMP/bft-$$.log" 2>&1 || tail -30 "$RUNNER_TEMP/bft-$$.log"
            XR=$(find "$DD" -name '*.xctestrun' -print 2>/dev/null | head -1)
          fi
          [ -n "$XR" ] || { echo "::error::нет .xctestrun — приложение не собрано"; exit 1; }
          PUSHDIR="$HOME/Library/Caches/l2push"; rm -rf "$PUSHDIR"; mkdir -p "$PUSHDIR" "$RUNNER_TEMP/out/launch"
          ( while [ ! -f "$PUSHDIR/stop" ]; do
              for f in "$PUSHDIR"/*.apns; do
                [ -e "$f" ] || continue
                if xcrun simctl push "$UDID" info.codix.liniya2 "$f" > "$f.log" 2>&1; then
                  cp "$f" "$RUNNER_TEMP/out/launch/"; mv "$f" "$f.sent"; echo "push: $(basename "$f")"
                else mv "$f" "$f.err"; cat "$f.log"; fi
              done; sleep 0.5
            done ) &
          export TEST_RUNNER_L2_PUSH_DIR="$PUSHDIR"
          export TEST_RUNNER_L2_LOGIN="$L2_LOGIN" TEST_RUNNER_L2_PASSWORD="$L2_PASSWORD" TEST_RUNNER_L2_PEER_NAME="Собеседник CI"
          export TEST_RUNNER_L2_PEER_LOGIN="$L2_PEER_LOGIN" TEST_RUNNER_L2_PEER_PASSWORD="$L2_PEER_PASSWORD" TEST_RUNNER_L2_IOS_UID="${L2_IOS_UID:-}"
          xcodebuild test-without-building -xctestrun "$XR" -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:TinodiosUITests/Linia2LaunchTests -resultBundlePath "$RUNNER_TEMP/launch.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/out/launch/launch.log" | grep -E 'error:|Test Case .* (passed|failed|skipped)|push:|\*\* TEST' || true
          touch "$PUSHDIR/stop"
          P=$(grep -c "Test Case .* passed" "$RUNNER_TEMP/out/launch/launch.log" || true)
          SK=$(grep -c "Test Case .* skipped" "$RUNNER_TEMP/out/launch/launch.log" || true)
          echo "### Запуск из уведомления + баги 1006: пройдено $P из 7, пропущено $SK $(grep -q '\*\* TEST SUCCEEDED \*\*' "$RUNNER_TEMP/out/launch/launch.log" && [ "$SK" = 0 ] && echo ✅ || echo ❌)" >> "$GITHUB_STEP_SUMMARY"
          grep -q '\*\* TEST SUCCEEDED \*\*' "$RUNNER_TEMP/out/launch/launch.log" && [ "$SK" = 0 ]

      - name: Итог звонка iOS ↔ веб
        id: webpeer
        if: ${{ !cancelled() && env.L2_WEB_PEER == '1' }}
        run: |
          for i in $(seq 1 60); do [ -f "$RUNNER_TEMP/out/web/call-peer.rc" ] && break; sleep 5; done
          RC=$(cat "$RUNNER_TEMP/out/web/call-peer.rc" 2>/dev/null || echo 99)
          echo "### Звонок iOS → веб: веб-сторона $( [ "$RC" = 0 ] && echo '✅ прошёл' || echo "❌ упал (код $RC)")" >> "$GITHUB_STEP_SUMMARY"
          tail -c 3000 "$RUNNER_TEMP/out/web/call-peer.json" 2>/dev/null | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
          [ "$RC" = 0 ]

      - name: Звонки iOS ↔ iOS и iOS ↔ веб (аудио и видео, 60+ с)
        id: calls
        if: ${{ !cancelled() }}
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          set -o pipefail
          OUT="$RUNNER_TEMP/out/calls"; mkdir -p "$OUT/web"
          # После XCUITest (повторы) симулятор бывает выключен — включаем и ждём загрузки.
          # Свой .xctestrun в отдельной папке сборки (не тот, что оставил `xcodebuild test` основного шага —
          # с ним были «No matching device … in XCTestDevices» и «server died»). Собирается один раз на оба шага.
          for D in "$UDID" ${UDID2:-}; do xcrun simctl boot "$D" 2>/dev/null || true; xcrun simctl bootstatus "$D" -b >/dev/null 2>&1 || true; done
          DD="$RUNNER_TEMP/dd-steps"
          XR=$(find "$DD" -name '*.xctestrun' -print 2>/dev/null | head -1)
          if [ -z "$XR" ]; then
            xcodebuild build-for-testing -workspace Tinodios.xcworkspace -scheme Tinodios -configuration Release \
              -derivedDataPath "$DD" -destination "platform=iOS Simulator,id=$UDID" ENABLE_TESTABILITY=YES \
              CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
              > "$RUNNER_TEMP/bft-$$.log" 2>&1 || tail -30 "$RUNNER_TEMP/bft-$$.log"
            XR=$(find "$DD" -name '*.xctestrun' -print 2>/dev/null | head -1)
          fi
          [ -n "$XR" ] || { echo "::error::нет .xctestrun — приложение не собрано"; exit 1; }
          # Разрешения на микрофон и камеру — без системных окон.
          RT=$(xcrun simctl list devices -j | python3 -c "import json,sys,os;d=json.load(sys.stdin)['devices'];print(next(k for k,v in d.items() for x in v if x['udid']==os.environ['UDID']))")
          UDID2=$(xcrun simctl create "L2 peer" "$(xcrun simctl list devices -j | python3 -c "import json,sys,os;d=json.load(sys.stdin)['devices'];print(next(x['deviceTypeIdentifier'] for v in d.values() for x in v if x['udid']==os.environ['UDID']))")" "$RT")
          xcrun simctl boot "$UDID2" || true; xcrun simctl bootstatus "$UDID2" -b >/dev/null 2>&1 || true
          for U in "$UDID" "$UDID2"; do
            for k in DidShowContinuousPathIntroduction DidShowGestureKeyboardIntroduction; do xcrun simctl spawn "$U" defaults write com.apple.keyboard.preferences $k -bool true || true; done
            xcrun simctl spawn "$U" defaults write com.apple.keyboard.preferences KeyboardAutocorrection -bool false || true
          done
          APP=$(find "$(dirname "$XR")" -maxdepth 2 -name 'Tinodios.app' -path '*iphonesimulator*' | head -1)
          [ -n "$APP" ] && xcrun simctl install "$UDID2" "$APP" || echo "::warning::не удалось установить приложение на второй симулятор заранее"
          xcrun simctl terminate "$UDID" info.codix.liniya2 2>/dev/null || true
          for U in "$UDID" "$UDID2"; do for k in microphone camera; do xcrun simctl privacy "$U" grant $k info.codix.liniya2 || true; done; done
          # Веб-собеседник B (Chrome с поддельными камерой/микрофоном).
          cp ci/web-tests/call-scenario.mjs "$RUNNER_TEMP/"
          ( L2_PEER_LOGIN="$L2_PEER_LOGIN" L2_PEER_PASSWORD="$L2_PEER_PASSWORD" L2_IOS_UID="$L2_IOS_UID" OUT_DIR="$OUT/web" \
            node "$RUNNER_TEMP/call-scenario.mjs" > "$OUT/web/result.json" 2> "$OUT/web/log.txt"; echo $? > "$OUT/web/rc" ) &
          # Второй симулятор: пользователь C принимает звонок A.
          ( TEST_RUNNER_L2_C_LOGIN="$L2_C_LOGIN" TEST_RUNNER_L2_C_PASSWORD="$L2_C_PASSWORD" TEST_RUNNER_L2_A_NAME="Тест CI" \
            xcodebuild test-without-building -xctestrun "$XR" -destination "platform=iOS Simulator,id=$UDID2" \
              -only-testing:TinodiosUITests/Linia2CallPeerTests/testAnswerIncomingCall -resultBundlePath "$RUNNER_TEMP/peer.xcresult" \
              > "$OUT/peer.log" 2>&1; echo $? > "$OUT/peer.rc" ) &
          sleep 75   # C входит и ждёт звонок
          export TEST_RUNNER_L2_LOGIN="$L2_LOGIN" TEST_RUNNER_L2_PASSWORD="$L2_PASSWORD" TEST_RUNNER_L2_PEER_NAME="Собеседник CI" TEST_RUNNER_L2_C_NAME="Собеседник iOS"
          xcodebuild test-without-building -xctestrun "$XR" -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:TinodiosUITests/Linia2CallTests -resultBundlePath "$RUNNER_TEMP/calls.xcresult" \
            2>&1 | tee "$OUT/main.log" | grep -E 'error:|Test Case .* (passed|failed|skipped)|\*\* TEST' || true
          for i in $(seq 1 60); do [ -f "$OUT/web/rc" ] && [ -f "$OUT/peer.rc" ] && break; sleep 5; done
          WRC=$(cat "$OUT/web/rc" 2>/dev/null || echo 99); PRC=$(cat "$OUT/peer.rc" 2>/dev/null || echo 99)
          grep -E 'Test Case .* (passed|failed|skipped)|error:' "$OUT/peer.log" | tail -5 || true
          M=$(grep -c "Test Case .* passed" "$OUT/main.log" || true); SK=$(grep -c "Test Case .* skipped" "$OUT/main.log" "$OUT/peer.log" | awk -F: '{s+=$2} END {print s+0}')
          {
            echo "### Звонки (обязательны для выпуска)"
            echo "- iOS (A): пройдено $M из 8 $(grep -q '\*\* TEST SUCCEEDED \*\*' "$OUT/main.log" && echo ✅ || echo ❌)"
            echo "- iOS (C, принимающий на втором симуляторе): $( [ "$PRC" = 0 ] && echo '✅' || echo "❌ (код $PRC)")"
            echo "- Веб (B): $( [ "$WRC" = 0 ] && echo '✅' || echo "❌ (код $WRC)")"
            echo "- Пропущенных: $SK (допустимо 0)"
            python3 -c "import json,sys;d=json.load(open(sys.argv[1]));[print('  - %s %s — %s' % ('✅' if s['ok'] else '❌', s['name'], s.get('detail',''))) for s in d.get('steps',[])]" "$OUT/web/result.json" 2>/dev/null || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q '\*\* TEST SUCCEEDED \*\*' "$OUT/main.log" && [ "$PRC" = 0 ] && [ "$WRC" = 0 ] && [ "$SK" = 0 ]

      # Стирание по коду на экране PIN (уровни 1–4, 10 неверных PIN, Face ID нигде): после звонков —
      # серверная проверка уровня 4 удалила бы пользователя A. Код — из L2_WIPE_OVERRIDE (в тесте);
      # серверная проверка (код через /panic/settings, удаление у собеседника) — L2_WIPE_SERVER=1.
      - name: Стирание данных по коду (Linia2PanicTests)
        id: panic
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          for D in "$UDID" ${UDID2:-}; do xcrun simctl boot "$D" 2>/dev/null || true; xcrun simctl bootstatus "$D" -b >/dev/null 2>&1 || true; done
          DD="$RUNNER_TEMP/dd-steps"
          XR=$(find "$DD" -name '*.xctestrun' -print 2>/dev/null | head -1)
          if [ -z "$XR" ]; then
            xcodebuild build-for-testing -workspace Tinodios.xcworkspace -scheme Tinodios -configuration Release \
              -derivedDataPath "$DD" -destination "platform=iOS Simulator,id=$UDID" ENABLE_TESTABILITY=YES \
              CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
              > "$RUNNER_TEMP/bft-$$.log" 2>&1 || tail -30 "$RUNNER_TEMP/bft-$$.log"
            XR=$(find "$DD" -name '*.xctestrun' -print 2>/dev/null | head -1)
          fi
          [ -n "$XR" ] || { echo "::error::нет .xctestrun — приложение не собрано"; exit 1; }
          mkdir -p "$RUNNER_TEMP/out/panic"
          xcrun simctl terminate "$UDID" info.codix.liniya2 2>/dev/null || true
          export TEST_RUNNER_L2_LOGIN="$L2_LOGIN" TEST_RUNNER_L2_PASSWORD="$L2_PASSWORD" TEST_RUNNER_L2_PEER_NAME="Собеседник CI"
          export TEST_RUNNER_L2_PEER_LOGIN="$L2_PEER_LOGIN" TEST_RUNNER_L2_PEER_PASSWORD="$L2_PEER_PASSWORD" TEST_RUNNER_L2_IOS_UID="${L2_IOS_UID:-}"
          export TEST_RUNNER_L2_WIPE_SERVER="${L2_WIPE_SERVER:-0}" TEST_RUNNER_L2_WIPE_SERVER_LEVEL="${L2_WIPE_SERVER_LEVEL:-2}"
          xcodebuild test-without-building -xctestrun "$XR" -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:TinodiosUITests/Linia2PanicTests -resultBundlePath "$RUNNER_TEMP/panic.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/out/panic/panic.log" | grep -E 'error:|Test Case .* (passed|failed|skipped)|\*\* TEST' || true
          P=$(grep -c "Test Case .* passed" "$RUNNER_TEMP/out/panic/panic.log" || true)
          SK=$(grep -c "Test Case .* skipped" "$RUNNER_TEMP/out/panic/panic.log" || true)
          echo "### Стирание по коду: пройдено $P из 6, пропущено $SK $(grep -q '\*\* TEST SUCCEEDED \*\*' "$RUNNER_TEMP/out/panic/panic.log" && [ "$SK" = 0 ] && echo ✅ || echo ❌)" >> "$GITHUB_STEP_SUMMARY"
          grep -q '\*\* TEST SUCCEEDED \*\*' "$RUNNER_TEMP/out/panic/panic.log" && [ "$SK" = 0 ]

      - name: Отчёт, скриншоты падений
        id: report
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out/shots" "$RUNNER_TEMP/out/failures" "$RUNNER_TEMP/out/crashes"
          for r in unit ui launch calls peer panic; do
            X="$RUNNER_TEMP/$r.xcresult"; [ -d "$X" ] || continue
            xcrun xcresulttool get test-results tests --path "$X" > "$RUNNER_TEMP/out/$r-tests.json" 2>/dev/null || true
            xcrun xcresulttool export attachments --path "$X" --output-path "$RUNNER_TEMP/out/failures/$r" --only-failures >/dev/null 2>&1 || true
          done
          [ -d "$RUNNER_TEMP/ui.xcresult" ] && xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" --output-path "$RUNNER_TEMP/out/shots" >/dev/null 2>&1 || true
          for r in launch calls peer panic; do [ -d "$RUNNER_TEMP/$r.xcresult" ] && xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$r.xcresult" --output-path "$RUNNER_TEMP/out/shots-$r" >/dev/null 2>&1 || true; done
          find ~/Library/Logs/DiagnosticReports -name '*.ips' -newer "$RUNNER_TEMP/ci.json" -exec cp {} "$RUNNER_TEMP/out/crashes/" \; 2>/dev/null || true
          cp "$RUNNER_TEMP"/unit.log "$RUNNER_TEMP"/test.log "$RUNNER_TEMP/out/" 2>/dev/null || true
          python3 ci/test-report.py "$RUNNER_TEMP/out" | tee "$RUNNER_TEMP/out/report.md" >> "$GITHUB_STEP_SUMMARY"
          if grep -qE '\*\* TEST (SUCCEEDED|FAILED) \*\*' "$RUNNER_TEMP/test.log" 2>/dev/null; then C=true; else C=false; fi
          if ls "$RUNNER_TEMP/out/crashes"/*.ips >/dev/null 2>&1 || grep -qE 'Restarting after unexpected exit|Lost connection to the test runner|terminated due to signal|crashed in ' "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/out/launch/launch.log" 2>/dev/null; then K=true; else K=false; fi
          echo "compiled=$C" >> "$GITHUB_OUTPUT"; echo "crashed=$K" >> "$GITHUB_OUTPUT"
          echo "Вылеты приложения: $K" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore

      - name: Удалить тестовых пользователей
        if: always()
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/del.mjs" <<'EOF'
          const [login, pass] = process.argv.slice(2);
          const ws = new WebSocket('wss://v2.chat-linia.site/v0/channels?apikey=AQEAAAABAAD_rAp4DJh05a1HAwFT3A6K');
          const send = o => ws.send(JSON.stringify(o));
          ws.onopen = () => send({hi:{id:'1',ver:'0.25'}});
          ws.onmessage = ev => { const m = JSON.parse(ev.data);
            if (m.meta && m.meta.sub) for (const s of m.meta.sub) if (s.topic && s.topic !== 'me') send({del:{id:'t'+s.topic,topic:s.topic,what:'topic',hard:true}});
            if (!m.ctrl) return;
            if (m.ctrl.id==='1') send({login:{id:'2',scheme:'basic',secret:Buffer.from(login+':'+pass).toString('base64')}});
            else if (m.ctrl.id==='2') { if (m.ctrl.code>=300) { console.log(login, 'вход', m.ctrl.code); process.exit(0); } send({sub:{id:'4',topic:'me',get:{what:'sub'}}}); }
            else if (m.ctrl.id==='4') { setTimeout(() => send({del:{id:'3',what:'user',hard:true}}), 1500); }
            else if (m.ctrl.id==='3') { console.log(login, 'удалён', m.ctrl.code); process.exit(0); } };
          setTimeout(()=>{ console.log(login, 'таймаут'); process.exit(0); }, 15000);
          EOF
          [ -n "$L2_LOGIN" ] && node "$RUNNER_TEMP/del.mjs" "$L2_LOGIN" "$L2_PASSWORD" || true
          [ -n "$L2_REG_LOGIN" ] && node "$RUNNER_TEMP/del.mjs" "$L2_REG_LOGIN" "$L2_REG_PASSWORD" || true
          [ -n "$L2_PEER_LOGIN" ] && node "$RUNNER_TEMP/del.mjs" "$L2_PEER_LOGIN" "$L2_PEER_PASSWORD" || true
          [ -n "$L2_C_LOGIN" ] && node "$RUNNER_TEMP/del.mjs" "$L2_C_LOGIN" "$L2_C_PASSWORD" || true

  # Дизайн-контроль: «фотограф» Linia2DesignShots на трёх iPhone × светлая/тёмная × обычный/крупный шрифт.
  # Запуск: Actions → UI tests → Run workflow → design = true. Итог — артефакт design-shots
  # (PNG <устройство>-<тема>-<шрифт>-<экран>-<состояние>.png).
  design:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.design }}
    runs-on: macos-15
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - device: se
            types: "iPhone-SE-3rd-generation"
            idx: 1
          - device: iphone16
            types: "iPhone-16 iPhone-15"
            idx: 2
          - device: promax
            types: "iPhone-16-Pro-Max iPhone-15-Pro-Max"
            idx: 3
    env:
      API: https://v2.chat-linia.site/invite/api
      L2_D_NAME: Дизайн CI
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | grep -v beta | sort -V | tail -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"; xcodebuild -version

      - name: Подготовка
        run: |
          cp ci/GoogleService-Info.stub.plist GoogleService-Info.plist
          which pod || sudo gem install cocoapods --no-document
          pod install --repo-update

      - name: Тестовые данные на сервере
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          [ -n "$CI_TOKEN" ] || { echo "::error::нет секрета CI_TOKEN"; exit 1; }
          RUN="${{ github.run_id }}${{ github.run_attempt }}"; RUN="${RUN: -9}"
          # A — пользователь приложения, D — «Дизайн CI» с подготовленной перепиской.
          for who in "A:${RUN}${{ matrix.idx }}" "D:${RUN}$(( ${{ matrix.idx }} + 5 ))"; do
            n=${who%%:*}; r=${who#*:}
            curl -sf -X POST "$API/ci/setup" -H "Authorization: Bearer $CI_TOKEN" -H 'Content-Type: application/json' \
                 -d "{\"run\":\"$r\"}" -o "$RUNNER_TEMP/$n.json"
          done
          python3 - "$RUNNER_TEMP/A.json" "$RUNNER_TEMP/D.json" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          a = json.load(open(sys.argv[1])); d = json.load(open(sys.argv[2]))
          print(f"L2_LOGIN={a['login']}"); print(f"L2_PASSWORD={a['password']}")
          print(f"L2_D_LOGIN={d['login']}"); print(f"L2_D_PASSWORD={d['password']}")
          PY
          echo "::add-mask::$(grep '^L2_PASSWORD=' $GITHUB_ENV | tail -1 | cut -d= -f2-)"
          echo "::add-mask::$(grep '^L2_D_PASSWORD=' $GITHUB_ENV | tail -1 | cut -d= -f2-)"

      - name: История переписки для теста
        run: node ci/seed-chat.mjs || echo "::warning::не удалось подготовить дизайн-чат"

      - name: Симулятор ${{ matrix.device }}
        run: |
          pick() { xcrun simctl list runtimes available | grep -o "com.apple.CoreSimulator.SimRuntime.iOS-$1-[0-9-]*" | sort -V | tail -1; }
          RT=$(pick 18); [ -n "$RT" ] || RT=$(pick 17)
          [ -n "$RT" ] || { echo "::error::нет симулятора iOS 18/17"; exit 1; }
          UDID=""
          for DT in ${{ matrix.types }}; do
            UDID=$(xcrun simctl create "L2 design $DT" "com.apple.CoreSimulator.SimDeviceType.$DT" "$RT" 2>/dev/null) && break || UDID=""
          done
          [ -n "$UDID" ] || { echo "::error::не удалось создать ${{ matrix.types }} на $RT"; xcrun simctl list devicetypes; exit 1; }
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "Симулятор ${{ matrix.device }}: $(xcrun simctl list devices | grep "$UDID" | sed 's/^ *//')" | tee -a "$GITHUB_STEP_SUMMARY"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1 || true
          for k in DidShowContinuousPathIntroduction DidShowGestureKeyboardIntroduction; do
            xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences $k -bool true || true
          done
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences KeyboardAutocorrection -bool false || true

      - name: Сборка
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -workspace Tinodios.xcworkspace -scheme Tinodios -configuration Release \
            -destination "platform=iOS Simulator,id=$UDID" \
            ENABLE_TESTABILITY=YES \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E 'error:|\*\* TEST BUILD' || true
          grep -q '\*\* TEST BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/build.log"

      - name: Снимки (тема × шрифт)
        run: |
          XR=$(find ~/Library/Developer/Xcode/DerivedData -name '*.xctestrun' -path '*Build/Products*' -print 2>/dev/null | head -1)
          [ -n "$XR" ] || { echo "::error::нет .xctestrun"; exit 1; }
          for k in microphone camera photos; do xcrun simctl privacy "$UDID" grant $k info.codix.liniya2 || true; done
          mkdir -p "$RUNNER_TEMP/design/png"
          for THEME in light dark; do
            for FONT in normal large; do
              TAG="${{ matrix.device }}-$THEME-$FONT"
              xcrun simctl ui "$UDID" appearance "$THEME" || true
              if [ "$FONT" = large ]; then xcrun simctl ui "$UDID" content_size accessibility-large || true
              else xcrun simctl ui "$UDID" content_size large || true; fi
              TEST_RUNNER_L2_LOGIN="$L2_LOGIN" TEST_RUNNER_L2_PASSWORD="$L2_PASSWORD" TEST_RUNNER_L2_D_NAME="$L2_D_NAME" \
              TEST_RUNNER_L2_THEME="$THEME" TEST_RUNNER_L2_FONT="$FONT" \
                xcodebuild test-without-building -xctestrun "$XR" -destination "platform=iOS Simulator,id=$UDID" \
                  -only-testing:TinodiosUITests/Linia2DesignShots -resultBundlePath "$RUNNER_TEMP/design/$TAG.xcresult" \
                  2>&1 | tee "$RUNNER_TEMP/design/$TAG.log" | grep -E 'error:|Test Case .* (passed|failed)|\*\* TEST' || true
              OUT="$RUNNER_TEMP/design/att-$TAG"; mkdir -p "$OUT"
              xcrun xcresulttool export attachments --path "$RUNNER_TEMP/design/$TAG.xcresult" --output-path "$OUT" >/dev/null 2>&1 || true
              python3 - "$OUT" "$TAG" "$RUNNER_TEMP/design/png" <<'PY'
          import json, os, re, shutil, sys
          src, tag, dst = sys.argv[1:4]
          try:
              manifest = json.load(open(os.path.join(src, "manifest.json")))
          except Exception:
              manifest = []
          seen = {}
          def walk(o):
              if isinstance(o, dict):
                  f = o.get("exportedFileName")
                  if f:
                      name = o.get("suggestedHumanReadableName") or o.get("name") or f
                      m = re.search(r"design-([A-Za-z0-9-]+?)(?:_\d+_[0-9A-Fa-f-]+)?\.(png|jpe?g|heic)$", name) or re.search(r"design-([A-Za-z0-9-]+)", name)
                      if m and os.path.exists(os.path.join(src, f)):
                          base = f"{tag}-{m.group(1)}"
                          seen[base] = seen.get(base, 0) + 1
                          suffix = "" if seen[base] == 1 else f"-{seen[base]}"
                          shutil.copy(os.path.join(src, f), os.path.join(dst, base + suffix + os.path.splitext(f)[1]))
                  for v in o.values(): walk(v)
              elif isinstance(o, list):
                  for v in o: walk(v)
          walk(manifest)
          print(tag, "снимков:", sum(seen.values()))
          PY
            done
          done
          N=$(ls "$RUNNER_TEMP/design/png" | wc -l | tr -d ' ')
          echo "### Дизайн-снимки ${{ matrix.device }}: $N" >> "$GITHUB_STEP_SUMMARY"
          ls "$RUNNER_TEMP/design/png" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-shots-${{ matrix.device }}
          path: ${{ runner.temp }}/design/png
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: design-logs-${{ matrix.device }}
          path: ${{ runner.temp }}/design/*.log
          if-no-files-found: ignore

      - name: Удалить тестовых пользователей
        if: always()
        run: |
          cat > "$RUNNER_TEMP/del.mjs" <<'EOF'
          const [login, pass] = process.argv.slice(2);
          const ws = new WebSocket('wss://v2.chat-linia.site/v0/channels?apikey=AQEAAAABAAD_rAp4DJh05a1HAwFT3A6K');
          const send = o => ws.send(JSON.stringify(o));
          ws.onopen = () => send({hi:{id:'1',ver:'0.25'}});
          ws.onmessage = ev => { const m = JSON.parse(ev.data);
            if (m.meta && m.meta.sub) for (const s of m.meta.sub) if (s.topic && s.topic !== 'me') send({del:{id:'t'+s.topic,topic:s.topic,what:'topic',hard:true}});
            if (!m.ctrl) return;
            if (m.ctrl.id==='1') send({login:{id:'2',scheme:'basic',secret:Buffer.from(login+':'+pass).toString('base64')}});
            else if (m.ctrl.id==='2') { if (m.ctrl.code>=300) { console.log(login, 'вход', m.ctrl.code); process.exit(0); } send({sub:{id:'4',topic:'me',get:{what:'sub'}}}); }
            else if (m.ctrl.id==='4') { setTimeout(() => send({del:{id:'3',what:'user',hard:true}}), 1500); }
            else if (m.ctrl.id==='3') { console.log(login, 'удалён', m.ctrl.code); process.exit(0); } };
          setTimeout(()=>{ console.log(login, 'таймаут'); process.exit(0); }, 15000);
          EOF
          [ -n "$L2_LOGIN" ] && node "$RUNNER_TEMP/del.mjs" "$L2_LOGIN" "$L2_PASSWORD" || true
          [ -n "$L2_D_LOGIN" ] && node "$RUNNER_TEMP/del.mjs" "$L2_D_LOGIN" "$L2_D_PASSWORD" || true

  design-shots:
    needs: design
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.design }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: design-shots
          pattern: design-shots-*
