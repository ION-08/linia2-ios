# Проверочная сборка без подписи: ловит ошибки компиляции, не трогая Apple.
name: Compile check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); sudo xcode-select -s "${XC:-/Applications/Xcode.app}"; xcodebuild -version
      - name: Подготовка
        run: |
          cp ci/GoogleService-Info.stub.plist GoogleService-Info.plist
          which pod || sudo gem install cocoapods --no-document
          pod install --repo-update
      - name: Build (без подписи)
        run: |
          set -o pipefail
          xcodebuild build -workspace Tinodios.xcworkspace -scheme Tinodios -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E 'error:|BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'BUILD SUCCEEDED' "$RUNNER_TEMP/build.log"
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: compile-log, path: "${{ runner.temp }}/build.log", if-no-files-found: ignore }
