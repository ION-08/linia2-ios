# Сборка «Линия 2.0» (info.codix.liniya2) и загрузка в TestFlight.
# Нужные секреты репозитория (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID           — Key ID ключа App Store Connect API
#   ASC_ISSUER_ID        — Issuer ID
#   ASC_KEY_P8_BASE64    — содержимое файла AuthKey_XXXX.p8 в base64
#   DIST_P12_BASE64, DIST_P12_PASSWORD, DIST_CERT_ID — сертификат Apple Distribution «Линии 2.0»
#   GOOGLE_SERVICE_INFO_PLIST_BASE64 — (необязательно) GoogleService-Info.plist для push через Firebase
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия (CFBundleShortVersionString); пусто — из файла VERSION"
        required: false

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      TEAM_ID: MXST7DT8VQ
      BUNDLE_ID: info.codix.liniya2
    steps:
      - uses: actions/checkout@v4

      - name: Выбор Xcode (последний 26.x)
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] || XC=/Applications/Xcode.app
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Версия и номер сборки
        run: |
          VERSION="${{ github.event.inputs.version }}"
          [ -n "$VERSION" ] || VERSION=$(cat VERSION)
          BUILD=$(( ${{ github.run_number }} + 0 ))
          sed -i '' -e "s/^GIT_TAG = .*/GIT_TAG = $VERSION/" -e "s/^GIT_COMMIT_COUNT = .*/GIT_COMMIT_COUNT = $BUILD/" prod.xcconfig
          grep -E '^(GIT_TAG|GIT_COMMIT_COUNT|HOST_NAME|APP_NAME)' prod.xcconfig
          echo "Версия $VERSION ($BUILD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Firebase-конфиг (или заглушка без push)
        env:
          GSI: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GSI" ]; then echo "$GSI" | base64 --decode > GoogleService-Info.plist; echo "Firebase: настоящий конфиг"
          else cp ci/GoogleService-Info.stub.plist GoogleService-Info.plist; echo "Firebase: заглушка (push через FCM выключен)"; fi

      - name: Ключ App Store Connect API
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$ASC_KEY_P8_BASE64" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error::Не заданы секреты ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64"; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/asc"
          KEY="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          { echo "$ASC_KEY_P8_BASE64" | base64 --decode; echo; } | sed '/^$/d' > "$KEY"
          chmod 600 "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          # Проверка ключа напрямую через App Store Connect API (токен не выводится).
          node -e '
            const c=require("crypto"),fs=require("fs");const e=process.env,n=Math.floor(Date.now()/1000);
            const b=o=>Buffer.from(JSON.stringify(o)).toString("base64url");
            const h=b({alg:"ES256",kid:e.ASC_KEY_ID,typ:"JWT"}),p=b({iss:e.ASC_ISSUER_ID,iat:n,exp:n+600,aud:"appstoreconnect-v1"});
            const s=c.sign("sha256",Buffer.from(h+"."+p),{key:fs.readFileSync(process.argv[1]),dsaEncoding:"ieee-p1363"}).toString("base64url");
            fetch("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=info.codix.liniya2",{headers:{Authorization:"Bearer "+h+"."+p+"."+s}})
              .then(async r=>{const j=await r.json();console.log("ASC API:",r.status,(j.data||[]).map(a=>a.attributes.name).join(","));if(r.status!==200)process.exit(1);});
          ' "$KEY"

      - name: Сертификат подписи (временный keychain)
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/linia2.keychain-db"; KCP=$(uuidgen)
          echo "$DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/dist.p12"
          security create-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          security import "$RUNNER_TEMP/asc/dist.p12" -P "$DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC" | sed -E 's/[0-9A-F]{40}/<hash>/'
          echo "LINIA2_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: App Store-профили
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          DIST_CERT_ID: ${{ secrets.DIST_CERT_ID }}
        run: node ci/profiles.mjs

      - name: CocoaPods
        run: |
          which pod || sudo gem install cocoapods --no-document
          pod install --repo-update

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Tinodios.xcworkspace -scheme Tinodios -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Linia2.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $LINIA2_KEYCHAIN" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E 'error:|ARCHIVE (SUCCEEDED|FAILED)' || true
          test -d "$RUNNER_TEMP/Linia2.xcarchive" || { grep -E 'error:' "$RUNNER_TEMP/archive.log" | head -40; exit 1; }

      - name: Export и загрузка в TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Linia2.xcarchive" \
            -exportOptionsPlist ci/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log"
          grep -qiE 'Upload succeeded|EXPORT SUCCEEDED' "$RUNNER_TEMP/export.log"
          echo "Сборка отправлена в App Store Connect → TestFlight (обработка 5–30 минут)." >> "$GITHUB_STEP_SUMMARY"

      - name: Логи сборки
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore

      - name: Удалить ключи
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc"
          [ -n "$LINIA2_KEYCHAIN" ] && security delete-keychain "$LINIA2_KEYCHAIN" || true
