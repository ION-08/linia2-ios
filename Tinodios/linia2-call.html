<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<!-- Линия 2.0: звонковый движок WebRTC для WKWebView (features.webCallEngine). Локальный файл из бандла —
     никакой код с сервера не загружается. Сигнализацию (Tinode videoCall: offer/answer/ice-candidate/hang-up),
     CallKit, кнопки и TURN-данные ведёт нативный код (Linia2WebCallEngine.swift); здесь — только медиа и
     RTCPeerConnection по той же схеме, что и веб-CallPanel Tinode / гостевая страница:
     звонящий: pc + канал данных «events» после «accept», затем offer; принимающий отвечает на offer на том же pc;
     удалённые кандидаты копятся до применения удалённого описания. -->
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;-webkit-user-select:none}
#remote{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:none}
#remote.on{display:block}
#local{position:fixed;object-fit:cover;border-radius:14px;background:#111;display:none;transform:scaleX(-1)}
#local.on{display:block}
#local.back{transform:none}
audio{display:none}
</style></head>
<body>
<video id="remote" playsinline autoplay muted></video>
<video id="local" playsinline autoplay muted></video>
<audio id="raudio" autoplay playsinline webkit-playsinline></audio>
<script>
(function () {
  'use strict';
  var S = {
    q: Promise.resolve(), pc: null, dc: null, stream: null, cache: [], cfg: {}, closed: false,
    established: false, initialOfferSent: false, facing: 'user', wantVideo: false, audioOn: true,
    remoteLive: false, localRect: null, statsTimer: null, lastBytes: 0,
    micGum: null, camGum: null, regrabs: 0
  };
  var $ = function (id) { return document.getElementById(id); };

  function post(m) {
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.l2call) {
        window.webkit.messageHandlers.l2call.postMessage(m);
      }
    } catch (e) {}
  }
  function diag(ev) { post({ t: 'diag', ev: ev }); }
  // LINIA2: все необработанные ошибки страницы — в диагностику звонка.
  window.addEventListener('error', function (e) { diag({ type: 'error', where: 'js', msg: String((e && e.message) || e).slice(0, 120), line: (e && e.lineno) || 0 }); });
  window.addEventListener('unhandledrejection', function (e) { var r = e && e.reason; diag({ type: 'error', where: 'js-promise', msg: String(r && (r.name || r.message) || r).slice(0, 120) }); });
  diag({ type: 'web-script', vis: document.visibilityState });
  function err(where, e) { post({ t: 'diag', ev: { type: 'error', where: where, msg: String(e && (e.name || e.message) || e) } }); }
  // Все операции — строго по очереди (как поток signaling у нативного WebRTC): offer/answer/кандидаты не обгоняют друг друга.
  function q(name, fn) {
    S.q = S.q.then(function () { if (!S.closed) return fn(); }).catch(function (e) { err(name, e); });
    return S.q;
  }
  function failed(stage) {
    // Как нативный движок: не соединились ни разу — завершаем звонок; соединялись — экран делает ICE restart.
    if (S.established) post({ t: 'negFailed', stage: stage }); else post({ t: 'close', why: stage });
  }

  // ---------- Медиа ----------
  function emptyVideoTrack() {
    try {
      var c = Object.assign(document.createElement('canvas'), { width: 320, height: 240 });
      c.getContext('2d').fillRect(0, 0, 320, 240);
      var t = c.captureStream(0).getVideoTracks()[0];
      if (t) t.enabled = false;
      return t || null;
    } catch (e) { return null; }
  }
  function audioConstraints() { return { echoCancellation: true, noiseSuppression: true, autoGainControl: true }; }
  function videoConstraints() { return { facingMode: S.facing, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 24, max: 30 } }; }
  function gum(c) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { diag({ type: 'gum', state: 'err', name: 'nomedia' }); return Promise.reject(new Error('nomedia')); }
    var t0 = Date.now();
    diag({ type: 'gum', state: 'start', audio: !!c.audio, video: !!c.video, vis: document.visibilityState });
    return navigator.mediaDevices.getUserMedia(c).then(function (st) {
      diag({ type: 'gum', state: 'ok', a: st.getAudioTracks().length, v: st.getVideoTracks().length, ms: Date.now() - t0 });
      return st;
    }, function (e) {
      diag({ type: 'gum', state: 'err', name: String(e && (e.name || e.message) || e).slice(0, 60), ms: Date.now() - t0, vis: document.visibilityState });
      throw e;
    });
  }
  function liveTrack(kind) {
    var st = S.stream; if (!st) return null;
    var a = kind === 'audio' ? st.getAudioTracks() : st.getVideoTracks();
    for (var i = 0; i < a.length; i++) if (a[i].readyState === 'live') return a[i];
    return null;
  }
  function sender(kind) {
    if (!S.pc) return null;
    var tr = S.pc.getTransceivers ? S.pc.getTransceivers() : [];
    for (var i = 0; i < tr.length; i++) {
      if (tr[i].stopped) continue;
      var r = tr[i].receiver && tr[i].receiver.track;
      if (r && r.kind === kind) return tr[i].sender;
    }
    return null;
  }
  function showLocal() {
    var v = $('local'), t = liveTrack('video');
    var on = !!(t && t.enabled && S.wantVideo && S.localRect);
    if (on) {
      if (v.srcObject !== S.stream) v.srcObject = S.stream;
      var r = S.localRect;
      v.style.left = r.x + 'px'; v.style.top = r.y + 'px'; v.style.width = r.w + 'px'; v.style.height = r.h + 'px';
      v.classList.toggle('back', S.facing !== 'user');
      try { var p = v.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    }
    v.classList.toggle('on', on);
  }
  // LINIA2: события трека (muted/unmuted/ended) — в диагностику; свой микрофон завершился — перезапросить.
  function watchTrack(t, side) {
    if (!t || t.__l2w) return; t.__l2w = true;
    ['mute', 'unmute', 'ended'].forEach(function (ev) {
      t.addEventListener(ev, function () {
        diag({ type: 'track-' + ev, side: side, kind: t.kind });
        if (side === 'local' && t.kind === 'audio' && ev === 'ended') resumeAudio('local-ended');
        if (side === 'local' && ev === 'mute') checkMuted(t, 'mute-event');
      });
    });
  }
  // Звук собеседника: muted=false, play(); результат — в диагностику (один раз на причину).
  function playRemoteAudio(why) {
    var a = $('raudio'); if (!a || !a.srcObject) return Promise.resolve();
    a.muted = false; a.volume = 1;
    var p; try { p = a.play(); } catch (x) { p = null; }
    if (!p || !p.then) return Promise.resolve();
    return p.then(function () { diag({ type: 'audio-play', state: 'ok', why: why }); },
                  function (x) { diag({ type: 'audio-play', state: 'err', why: why, name: String(x && (x.name || x.message) || x).slice(0, 60) }); });
  }
  // LINIA2 (звук варианта Б): микрофон берётся ОДИН раз. Раньше audio-resume при CallKit «activated»/«ready-active»,
  // пришедшем во время первого getUserMedia (mic:none), запускал второй getUserMedia и останавливал первый трек.
  // В WebKit (iOS) у всех треков микрофона общий CoreAudio-блок захвата: новый захват прерывает старый, а stop()
  // старого трека мог остановить общий блок — трек в sender «live», но сэмплов нет → RTP аудио не уходит
  // (outbound/inbound-rtp audio нет вовсе, akind '', atx/arx 0 на обоих iPhone). Теперь: ждём первый захват;
  // трек live/muted — ничего не перезапрашиваем (muted после прерывания WebKit снимает сам); новый захват — только если
  // трека нет или он ended; старый трек останавливаем ПОСЛЕ replaceTrack, и одновременно — только один захват.
  function micTrackState(t) { return t ? (t.readyState === 'ended' ? 'ended' : (t.muted ? 'muted' : 'live')) : 'none'; }
  // LINIA2 (звук 1012, call_diag 766/769): WebKit заглушил захват (CallKit активировал AVAudioSession во время
  // getUserMedia) — трек «live», но muted навсегда, RTP аудио/видео не уходит. Нативу — «снять mute захвата»
  // (setMicrophoneCaptureState/setCameraCaptureState .active); трек всё ещё muted через 1,2 с — новый захват
  // (getUserMedia + replaceTrack), не ждём WebKit. Не больше 3 перезахватов на звонок.
  function checkMuted(t, why) {
    if (!t || !t.muted || t.readyState !== 'live' || S.closed) return;
    post({ t: 'capMuted', kind: t.kind, why: why });
    setTimeout(function () {
      if (S.closed || !t.muted || t.readyState !== 'live') { if (!S.closed) diag({ type: 'cap-unmuted', kind: t.kind, why: why }); return; }
      if (S.regrabs >= 3) { diag({ type: 'cap-muted', kind: t.kind, why: why, action: 'give-up' }); return; }
      S.regrabs++;
      diag({ type: 'cap-muted', kind: t.kind, why: why, action: 'regrab', n: S.regrabs });
      if (t.kind === 'audio') q('regrabMic', function () { var c = liveTrack('audio'); if (c && c !== t && !c.muted) return; return regrabMic('muted-' + why); });
      else if (S.wantVideo) q('regrabCam', function () { var c = liveTrack('video'); if (c && c !== t && !c.muted) return; return regrabCam('muted-' + why); });
    }, 1200);
  }
  function regrabCam(why) {
    if (S.camGum) return S.camGum;
    S.camGum = gum({ video: videoConstraints() }).then(function (st) {
      var nt = st.getVideoTracks()[0]; if (!nt || S.closed) { if (nt) nt.stop(); return; }
      watchTrack(nt, 'local');
      var olds = S.stream ? S.stream.getVideoTracks() : [];
      if (!S.stream) S.stream = new MediaStream();
      var s = sender('video');
      return (s ? s.replaceTrack(nt) : Promise.resolve()).then(function () {
        olds.forEach(function (o) { try { S.stream.removeTrack(o); o.stop(); } catch (e) {} });
        S.stream.addTrack(nt);
        showLocal();
        diag({ type: 'camera-regrab', state: 'replaced', why: why, sender: !!s });
        post({ t: 'media', audio: !!liveTrack('audio'), video: true });
      });
    }).catch(function (e) { err('camera-regrab', e); }).then(function () { S.camGum = null; });
    return S.camGum;
  }
  function resumeAudio(why) {
    playRemoteAudio(why);
    // В очереди команд — после start (он ждёт первый getUserMedia), а не параллельно ему.
    return q('audioResume', function () {
      var t = liveTrack('audio');
      var st = micTrackState(t);
      diag({ type: 'audio-resume', why: why, mic: st, enabled: t ? !!t.enabled : false, pending: !!S.micGum });
      if (st === 'live') { syncSender('resume'); return; }
      // muted = захват прерван (CallKit/другое приложение) — WebKit снимет mute сам; новый захват тут прервал бы и этот.
      if (st === 'muted') { checkMuted(t, why); syncSender('resume-muted'); return; }
      return regrabMic(why);
    });
  }
  function regrabMic(why) {
    if (S.micGum) return S.micGum;
    S.micGum = gum({ audio: audioConstraints() }).then(function (st) {
      var nt = st.getAudioTracks()[0]; if (!nt || S.closed) { if (nt) nt.stop(); return; }
      nt.enabled = S.audioOn;
      watchTrack(nt, 'local');
      var olds = S.stream ? S.stream.getAudioTracks() : [];
      if (!S.stream) S.stream = new MediaStream();
      var s = sender('audio');
      return (s ? s.replaceTrack(nt) : Promise.resolve()).then(function () {
        olds.forEach(function (o) { try { S.stream.removeTrack(o); o.stop(); } catch (e) {} });
        S.stream.addTrack(nt);
        diag({ type: 'audio-resume', state: 'mic-replaced', why: why, sender: !!s });
        post({ t: 'media', audio: true, video: !!liveTrack('video') });
      });
    }).catch(function (e) { err('audio-resume', e); }).then(function () { S.micGum = null; });
    return S.micGum;
  }
  // В sender аудио — именно текущий live-трек микрофона (не остановленный/старый).
  function syncSender(why) {
    var s = sender('audio'), t = liveTrack('audio');
    if (!s || !t || s.track === t) return Promise.resolve();
    diag({ type: 'audio-sender-sync', why: why, had: s.track ? s.track.readyState : 'none' });
    return s.replaceTrack(t).catch(function (e) { err('sender-sync', e); });
  }

  function startMedia() {
    var wantV = !!S.cfg.video;
    S.wantVideo = wantV;
    return gum({ audio: audioConstraints(), video: wantV ? videoConstraints() : false })
      .catch(function (e) {
        err('gum', e);
        // Камера недоступна — только микрофон; микрофон недоступен — слушаем без него (как нативный экран).
        return (wantV ? gum({ audio: audioConstraints() }) : Promise.reject(e)).catch(function (e2) {
          err('gum-audio', e2);
          return new MediaStream();
        });
      })
      .then(function (st) {
        S.stream = st;
        var a = st.getAudioTracks()[0];
        if (a) { a.enabled = S.audioOn; watchTrack(a, 'local'); }
        var v = st.getVideoTracks()[0];
        if (v) watchTrack(v, 'local');
        post({ t: 'media', audio: !!a, video: !!v, amuted: !!(a && a.muted), vmuted: !!(v && v.muted) });
        showLocal();
        checkMuted(a, 'gum');
        checkMuted(v, 'gum');
      });
  }

  // ---------- Соединение ----------
  function createPC(ice, policy, withDC) {
    if (S.pc) return;
    S.cache = [];
    var pc = S.pc = new RTCPeerConnection({ iceServers: ice || [], iceTransportPolicy: policy || 'all', bundlePolicy: 'max-bundle', rtcpMuxPolicy: 'require' });
    pc.onicecandidate = function (e) {
      if (e.candidate && e.candidate.candidate) {
        var c = e.candidate.toJSON ? e.candidate.toJSON() : e.candidate;
        post({ t: 'ice', c: { candidate: c.candidate, sdpMid: c.sdpMid, sdpMLineIndex: c.sdpMLineIndex } });
      }
    };
    pc.oniceconnectionstatechange = function () {
      if (pc !== S.pc) return;
      var s = pc.iceConnectionState;
      if (s === 'connected' || s === 'completed') S.established = true;
      post({ t: 'iceState', state: s });
    };
    pc.onconnectionstatechange = function () { if (pc === S.pc) diag({ type: 'conn', state: pc.connectionState }); };
    pc.onsignalingstatechange = function () { if (pc === S.pc) post({ t: 'signaling', state: pc.signalingState }); };
    // Перенастройку не начинаем сами: первый offer — явно (makeOffer), ICE restart — по команде экрана.
    pc.onnegotiationneeded = function () {};
    // Звук — отдельным <audio> (только аудиотреки), <video> — только картинка без звука (исправление гостевой страницы).
    pc.ontrack = function (e) {
      var st = (e.streams && e.streams[0]) || new MediaStream([e.track]);
      var v = $('remote'), a = $('raudio');
      if (e.track.kind === 'video') {
        if (v.srcObject !== st) { v.srcObject = st; v.muted = true; }
        try { var pv = v.play(); if (pv && pv.catch) pv.catch(function () {}); } catch (x) {}
      }
      var at = st.getAudioTracks()[0] || (e.track.kind === 'audio' ? e.track : null);
      if (at) {
        var cur = a.srcObject && a.srcObject.getAudioTracks()[0];
        if (!cur || cur.id !== at.id) a.srcObject = new MediaStream([at]);
        playRemoteAudio('track');
      }
      watchTrack(e.track, 'remote');
      diag({ type: 'track', kind: e.track.kind, muted: !!e.track.muted, state: e.track.readyState });
    };
    pc.ondatachannel = function (e) { bindDC(e.channel); };

    var st = S.stream || new MediaStream();
    var a = liveTrack('audio');
    if (a) pc.addTrack(a, st); else pc.addTransceiver('audio', { direction: 'sendrecv', streams: [st] });
    var v = liveTrack('video') || emptyVideoTrack();
    if (v) pc.addTrack(v, st); else pc.addTransceiver('video', { direction: 'sendrecv', streams: [st] });
    if (withDC) bindDC(pc.createDataChannel('events', { ordered: true }));
    var as = sender('audio');
    diag({ type: 'pc-audio', track: as && as.track ? micTrackState(as.track) : 'none', same: !!(as && a && as.track === a), n: pc.getTransceivers().length });
    diag({ type: 'pc', iceServers: (ice || []).length, turn: (ice || []).some(function (s) { return [].concat(s.urls).some(function (u) { return /^turns?:/.test(u); }); }) });
    if (!S.statsTimer) S.statsTimer = setInterval(stats, 2000);
  }
  function bindDC(dc) {
    S.dc = dc;
    dc.onopen = function () { if (!S.cfg.audioOnly && camOn()) sendDC('video:unmuted'); };
    dc.onmessage = function (e) { post({ t: 'dc', ev: String(e.data) }); };
  }
  function sendDC(ev) { try { if (S.dc && S.dc.readyState === 'open') S.dc.send(ev); } catch (e) {} }
  function camOn() { var t = liveTrack('video'); return !!(t && t.enabled); }

  // LINIA2: SDP в диагностику — по каждому m=: вид, direction, mid, кодеки; после согласования — currentDirection трансиверов.
  function sdpInfo(sdp) {
    var out = [], cur = null;
    String(sdp || '').split(/\r?\n/).forEach(function (l) {
      var m = /^m=(\w+) (\d+) ([^ ]+)/.exec(l);
      if (m) { cur = { k: m[1], port: +m[2], dir: 'sendrecv', mid: '', c: [] }; out.push(cur); return; }
      if (!cur) return;
      if (/^a=(sendrecv|sendonly|recvonly|inactive)$/.test(l)) cur.dir = l.slice(2);
      else if (l.indexOf('a=mid:') === 0) cur.mid = l.slice(6);
      else if (l.indexOf('a=rtpmap:') === 0 && cur.c.length < 3) cur.c.push(l.split(' ')[1].split('/')[0]);
      else if (l.indexOf('a=ssrc:') === 0 && !cur.ssrc) cur.ssrc = 1;
    });
    return out.map(function (x) { return x.k + ':' + x.dir + ':' + x.mid + ':' + (x.port || 0) + ':' + x.c.join('/') + (x.ssrc ? ':ssrc' : ''); }).join(' ');
  }
  function sdpDiag(side, d) { if (d) diag({ type: 'sdp', side: side, sdpType: d.type, m: sdpInfo(d.sdp) }); }
  function trInfo() {
    var pc = S.pc; if (!pc || !pc.getTransceivers) return '';
    return pc.getTransceivers().map(function (t) {
      var k = (t.receiver && t.receiver.track && t.receiver.track.kind) || '?';
      var st = t.sender && t.sender.track;
      return k[0] + (t.mid == null ? '-' : t.mid) + ':' + t.direction + '/' + (t.currentDirection || '-') + ':' + (st ? micTrackState(st) + (st.enabled ? '' : '-dis') : 'notrack');
    }).join(' ');
  }
  function negotiated(why) {
    sdpDiag('local', S.pc.localDescription); sdpDiag('remote', S.pc.remoteDescription);
    diag({ type: 'transceivers', why: why, tr: trInfo() });
    return syncSender(why);
  }
  function drainCache() {
    var pc = S.pc, list = S.cache; S.cache = [];
    diag({ type: 'candidates', drained: list.length });
    return Promise.all(list.map(function (c) { return pc.addIceCandidate(c).catch(function (e) { err('drainIceCandidates', e); }); }));
  }
  function offer(restart) {
    var pc = S.pc;
    return syncSender('offer').then(function () { return pc.createOffer(restart ? { iceRestart: true } : {}); })
      .then(function (o) { return pc.setLocalDescription(o); })
      .then(function () { post({ t: 'offer', sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp } }); })
      .catch(function (e) { err(restart ? 'restartOffer' : 'offer', e); failed(restart ? 'restartOffer' : 'offer'); });
  }
  function applyOffer(desc) {
    var pc = S.pc;
    diag({ type: 'web-offer-received', signaling: pc.signalingState });
    return pc.setRemoteDescription(desc)
      .then(drainCache)
      .then(function () { return pc.createAnswer(); })
      .then(function (a) { diag({ type: 'web-answer-created' }); return pc.setLocalDescription(a); })
      .then(function () {
        diag({ type: 'web-answer-sent' });
        post({ t: 'answer', sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp } });
        post({ t: 'setupComplete', remoteOffer: true });
        return negotiated('answer-sent');
      })
      .catch(function (e) { err('remoteOffer', e); failed('remoteOffer'); });
  }

  // ---------- Команды нативного кода ----------
  var api = {
    start: function (cfg) {
      S.cfg = cfg || {};
      S.closed = false;
      S.regrabs = 0;
      if (S.cfg.established) S.established = true;   // переход «нативный → WKWebView» посреди соединённого звонка
      return q('start', startMedia);
    },
    createPC: function (o) { return q('createPC', function () { createPC(o.ice, o.policy, !!o.dc); }); },
    makeOffer: function () {
      return q('makeOffer', function () {
        if (!S.pc || S.initialOfferSent) return;
        S.initialOfferSent = true;
        return offer(false);
      });
    },
    remoteOffer: function (desc) {
      return q('remoteOffer', function () {
        var pc = S.pc; if (!pc) { diag({ type: 'error', where: 'web-offer-no-pc' }); return; }
        if (pc.signalingState === 'have-local-offer') {
          // Встречные offer (оба переподключаются): звонящий («невежливый») игнорирует, принимающий откатывает свой.
          if (S.cfg.caller) { diag({ type: 'glare', action: 'ignore' }); return; }
          diag({ type: 'glare', action: 'rollback' });
          return pc.setLocalDescription({ type: 'rollback' }).catch(function () {}).then(function () { return applyOffer(desc); });
        }
        return applyOffer(desc);
      });
    },
    remoteAnswer: function (desc) {
      return q('remoteAnswer', function () {
        var pc = S.pc; if (!pc) return;
        if (pc.signalingState !== 'have-local-offer') { diag({ type: 'answer-ignored', signaling: pc.signalingState }); return; }
        return pc.setRemoteDescription(desc)
          .then(drainCache)
          .then(function () { post({ t: 'setupComplete', remoteOffer: false }); return negotiated('answer-received'); })
          .catch(function (e) { err('remoteAnswer', e); failed('remoteAnswer'); });
      });
    },
    remoteIce: function (c) {
      return q('remoteIce', function () {
        if (!c || !c.candidate) return;
        var init = { candidate: c.candidate, sdpMid: c.sdpMid, sdpMLineIndex: c.sdpMLineIndex };
        if (!S.pc || !S.pc.remoteDescription) { S.cache.push(init); return; }
        return S.pc.addIceCandidate(init).catch(function (e) { err('addIceCandidate', e); });
      });
    },
    restartIce: function (o) {
      return q('restartIce', function () {
        var pc = S.pc; if (!pc) return;
        try {
          var cfg = pc.getConfiguration();
          if (o.ice && o.ice.length) cfg.iceServers = o.ice;
          if (o.relay) cfg.iceTransportPolicy = 'relay';
          pc.setConfiguration(cfg);
        } catch (e) { err('setConfiguration', e); }
        diag({ type: 'ice-restart', relay: !!o.relay, signaling: pc.signalingState });
        var pre = pc.signalingState === 'have-local-offer' ? pc.setLocalDescription({ type: 'rollback' }).catch(function () {}) : Promise.resolve();
        return pre.then(function () { return offer(true); });
      });
    },
    setAudio: function (on) {
      S.audioOn = !!on;
      return q('setAudio', function () {
        var t = liveTrack('audio');
        if (t) { t.enabled = S.audioOn; return; }
        if (!S.audioOn) return;
        // Микрофон разрешили во время звонка — берём его и подставляем в уже согласованный sender (без перенастройки).
        return regrabMic('setAudio');
      });
    },
    setCamera: function (on) {
      S.wantVideo = !!on;
      return q('setCamera', function () {
        var t = liveTrack('video');
        var s = sender('video');
        if (!on) {
          if (t) { t.enabled = false; t.stop(); S.stream.removeTrack(t); }
          if (s) s.replaceTrack(emptyVideoTrack()).catch(function () {});
          sendDC('video:muted');
          showLocal();
          return;
        }
        if (t) { t.enabled = true; showLocal(); sendDC('video:unmuted'); return; }
        return gum({ video: videoConstraints() }).then(function (st) {
          var nt = st.getVideoTracks()[0]; if (!nt) return;
          if (!S.stream) S.stream = new MediaStream();
          S.stream.addTrack(nt);
          showLocal();
          return (s ? s.replaceTrack(nt) : Promise.resolve()).then(function () { sendDC('video:unmuted'); });
        }).catch(function (e) { err('camera', e); post({ t: 'cameraFailed' }); });
      });
    },
    setVideoEnabled: function (on) { var t = liveTrack('video'); if (t) t.enabled = !!on; showLocal(); },
    switchCamera: function () {
      return q('switchCamera', function () {
        var old = liveTrack('video'); if (!old) return;
        S.facing = S.facing === 'user' ? 'environment' : 'user';
        old.stop(); S.stream.removeTrack(old);
        return gum({ video: videoConstraints() }).then(function (st) {
          var nt = st.getVideoTracks()[0];
          S.stream.addTrack(nt);
          var s = sender('video');
          showLocal();
          if (s) return s.replaceTrack(nt);
        });
      });
    },
    sendDC: function (ev) { sendDC(ev); },
    setRemoteVisible: function (on) { S.remoteLive = !!on; $('remote').classList.toggle('on', S.remoteLive); },
    setLocalRect: function (r) { S.localRect = r && r.w > 0 ? r : null; showLocal(); },
    setPaused: function (paused) {
      if (!S.pc) return;
      S.pc.getSenders().forEach(function (s) {
        try {
          var p = s.getParameters();
          if (!p.encodings || !p.encodings.length) return;
          p.encodings.forEach(function (e) { e.active = !paused; });
          s.setParameters(p).catch(function () {});
        } catch (e) {}
      });
      diag({ type: 'uitest-media', paused: !!paused });
    },
    muteAll: function () {
      if (S.stream) S.stream.getTracks().forEach(function (t) { t.enabled = false; });
      try { $('raudio').muted = true; } catch (e) {}
    },
    close: function () {
      S.closed = true;
      if (S.statsTimer) { clearInterval(S.statsTimer); S.statsTimer = null; }
      S.micGum = null; S.camGum = null;
      try { if (S.dc) S.dc.close(); } catch (e) {}
      try { if (S.pc) S.pc.close(); } catch (e) {}
      if (S.stream) S.stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} });
      ['remote', 'local', 'raudio'].forEach(function (id) { try { $(id).srcObject = null; } catch (e) {} });
      S.pc = null; S.dc = null; S.stream = null; S.cache = [];
      S.established = false; S.initialOfferSent = false;
      S.q = Promise.resolve();
    },
    // CallKit включил звук / прерывание закончилось / микрофон разрешили — см. resumeAudio.
    audioResume: function (o) { return resumeAudio((o && o.reason) || 'native'); },
    // Для тестов: уровень/байты звука.
    state: function () {
      return { pc: !!S.pc, ice: S.pc ? S.pc.iceConnectionState : 'none', signaling: S.pc ? S.pc.signalingState : 'none',
               audio: !!liveTrack('audio'), video: !!liveTrack('video'), bytesIn: S.lastBytes };
    }
  };

  var last = null;
  function stats() {
    var pc = S.pc; if (!pc) return;
    pc.getStats().then(function (r) {
      var o = { aIn: 0, aOut: 0, vIn: 0, vOut: 0, lost: 0, recv: 0, rtt: 0, level: 0, pair: '', aKind: '', rtp: '', tr: trInfo() };
      var rtp = [];
      // LINIA2: WebKit может не заполнять kind — берём kind || mediaType || тип кодека (audio/opus → audio).
      function kindOf(s) {
        var k = s.kind || s.mediaType;
        if (!k && s.codecId && r.get) { var c = r.get(s.codecId); if (c && c.mimeType) k = String(c.mimeType).split('/')[0].toLowerCase(); }
        return k || '';
      }
      r.forEach(function (s) {
        var k = (s.type === 'inbound-rtp' || s.type === 'outbound-rtp' || s.type === 'media-source') ? kindOf(s) : '';
        // LINIA2: каждый RTP-отчёт: in/out, вид, mid, байты, пакеты — видно, есть ли аудиопоток вообще и по какому mid.
        if (s.type === 'inbound-rtp' || s.type === 'outbound-rtp') rtp.push((s.type[0] === 'i' ? 'i' : 'o') + (k ? k[0] : '?') + (s.mid != null ? s.mid : '') + '=' + (s.bytesReceived || s.bytesSent || 0) + '/' + (s.packetsReceived || s.packetsSent || 0));
        if (s.type === 'inbound-rtp' && k === 'audio') { o.aIn += s.bytesReceived || 0; o.lost += s.packetsLost || 0; o.recv += s.packetsReceived || 0; if (s.audioLevel != null) o.level = s.audioLevel; if (s.totalAudioEnergy != null) o.energyIn = s.totalAudioEnergy; o.aKind = s.kind ? 'kind' : (s.mediaType ? 'mediaType' : 'codec'); }
        if (s.type === 'inbound-rtp' && k === 'video') o.vIn += s.bytesReceived || 0;
        if (s.type === 'outbound-rtp' && k === 'audio') o.aOut += s.bytesSent || 0;
        if (s.type === 'outbound-rtp' && k === 'video') o.vOut += s.bytesSent || 0;
        if (s.type === 'media-source' && k === 'audio' && s.audioLevel != null) o.micLevel = s.audioLevel;
        if (s.type === 'candidate-pair' && s.nominated && s.state === 'succeeded') {
          o.rtt = s.currentRoundTripTime || 0;
          var lc = r.get ? r.get(s.localCandidateId) : null;
          o.pair = lc ? (lc.candidateType || '') : '';
        }
      });
      o.rtp = rtp.join(' ');
      // Звук собеседника: <audio> играет (paused/readyState/currentTime) — проверка «приходит, но не слышно».
      try { var ae = $('raudio'); o.ael = (ae.paused ? 'p' : 'r') + ae.readyState + (ae.muted ? 'm' : '') + ':' + Math.round(ae.currentTime); } catch (x) {}
      var lt = liveTrack('audio'); o.mic = micTrackState(lt); var lv = liveTrack('video'); if (lv) o.cam = micTrackState(lv);
      S.lastBytes = o.aIn;
      post({ t: 'stats', s: o });
      last = o;
    }).catch(function () {});
  }

  window.L2Call = api;
  // Вызов от нативного кода: L2Call.cmd('name', {json}) — ошибки не роняют страницу.
  api.cmd = function (name, arg) {
    try { var f = api[name]; if (f) f(arg); } catch (e) { err('cmd:' + name, e); }
    return true;
  };
  post({ t: 'ready' });
})();
</script>
</body></html>
